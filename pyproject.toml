[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.12",
]
build-backend = "scikit_build_core.build"

[project]
name = "pyds4"
version = "1.0.2"
description = "Python bindings for the DS4 native inference engine"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Avalan contributors" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
]

[project.urls]
Homepage = "https://github.com/avalan-ai/pyds4"
Repository = "https://github.com/avalan-ai/pyds4"
Issues = "https://github.com/avalan-ai/pyds4/issues"

[project.optional-dependencies]
test = [
  "pytest>=8",
]
dev = [
  "black>=25.1.0",
  "mypy>=1.20.0",
  "pybind11>=2.12",
  "ruff>=0.11.11",
]
release = [
  "auditwheel>=6.0; sys_platform == 'linux'",
  "build>=1.2",
  "cmake>=3.20",
  "ninja>=1.5",
  "twine>=6.0",
]

[tool.scikit-build]
wheel.packages = ["src/pyds4"]
build-dir = "build/{wheel_tag}"

[tool.scikit-build.sdist]
include = [
  "/CMakeLists.txt",
  "/LICENSE",
  "/Makefile",
  "/README.md",
  "/RELEASING.md",
  "/pyproject.toml",
  "scripts/*.py",
  "specs/DS4-BINDING.md",
  "specs/DS4-BINDING-IMPL.md",
  "src/pyds4/_build_config.py.in",
  "src/pyds4/*.pyi",
  "src/pyds4/*.hpp",
  "src/pyds4/_native.cpp",
  "tests/fake_ds4/*",
  "tests/native/*.cpp",
  "/.clang-format",
  "/.clang-tidy",
]
exclude = [
  ".local/**",
  ".pytest_cache",
  ".pytest_cache/*",
  ".pytest_cache/**",
  ".venv/**",
  "build/**",
  "*.sw[mnop]",
  "__pycache__/**",
  "*.py[cod]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.black]
line-length = 79
target-version = ["py311"]

[tool.ruff]
line-length = 79
indent-width = 4
src = ["src"]
fix = true
target-version = "py311"
preview = true

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "D",
  "I",
  "UP006",
  "UP007",
  "UP045",
]
ignore = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D107",
  "D400",
]

[tool.ruff.lint.isort]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
known-first-party = ["pyds4"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
files = ["src/pyds4"]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
show_error_code_links = true
pretty = true
exclude_gitignore = true
local_partial_types = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disable_error_code = ["override"]
enable_error_code = ["ignore-without-code"]
